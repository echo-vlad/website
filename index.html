<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beer Invite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="beer-bg" aria-hidden="true">
  <div class="foam"></div>
  <div class="bubbles bubbles-1"></div>
  <div class="bubbles bubbles-2"></div>
  <div class="bubbles bubbles-3"></div>
</div>


  <div class="container" id="container">
    <h1>Salut Tudor, vrei sa bem o bere?</h1>

    <div class="buttons">
      <button id="yesBtn">Da</button>
      <button id="noBtn">Nu</button>
    </div>

    <p id="message"></p>
  </div>

  <!-- Custom Modal -->
  <div id="modal" class="modal">
    <div class="modal-box">
      <p>Scrie-i finului</p>
      <button id="closeModal">Ok 🍻</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
