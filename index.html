<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beer Invite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg" aria-hidden="true">
    <span class="beer b1"></span>
    <span class="beer b2"></span>
    <span class="beer b3"></span>
    <span class="beer b4"></span>
    <span class="beer b5"></span>
    <span class="beer b6"></span>
  </div>

  <div class="container" id="container">
    <h1>Salut Tudor, vrei sa bem o bere?</h1>

    <div class="buttons">
      <button id="yesBtn">Da</button>
      <button id="noBtn">Nu</button>
    </div>

    <p id="message"></p>
  </div>

  <!-- Custom Modal -->
  <div id="modal" class="modal">
    <div class="modal-box">
      <p>Scrie-i finului</p>
      <button id="closeModal">Perfect 🍻</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
